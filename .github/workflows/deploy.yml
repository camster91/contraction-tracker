# contraction-tracker — VPS deploy
#
# Thin caller for camster91/ashbi-deploy's reusable workflow. The
# reusable handles ssh, docker build, up, smoke test, health check.
# This file just provides the project-specific config (compose +
# .env, port, public URL, paired relay).
#
# Image versioning / rollback:
#   This repo deploys via the camster91/ashbi-deploy reusable.
#   The reusable writes docker-compose.yml + .env on the host,
#   then `docker compose build --no-cache` from the host's
#   /opt/projects/contraction-tracker/src/ directory. The reusable
#   does NOT pull source. Pre-flight `sync-source-on-host` job
#   below does that — it git-resets /opt/projects/contraction-tracker/src
#   to origin/main before the deploy job runs. Without that pre-flight,
#   the build context on the host would be whatever was checked out
#   at the time of the FIRST deploy (often a stale chore-champs
#   checkout or similar), and `docker compose build` would happily
#   produce an old image even after a successful workflow run. The
#   pre-flight is what keeps the live container in sync with the
#   current source. To rollback this live app, push a known-good
#   commit and the pre-flight will pull it; or `git checkout <sha>`
#   on the host manually.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Pre-flight: rsync the latest source from the runner's git
  # checkout to the host's /opt/projects/contraction-tracker/src/
  # directory. The reusable runs `docker compose build --no-cache`
  # from the host's src/ as the build context — without this
  # pre-flight, the build would use whatever files were copied at
  # the time of the first manual deploy (often a stale chore-champs
  # clone or similar), and `docker compose build` would happily
  # produce an old image even after a "successful" workflow run.
  # The pre-flight is what keeps the live container in sync with
  # the current source.
  #
  # Why rsync instead of git pull: the host's src/ is a plain
  # directory copy (no .git) from a previous manual setup. We
  # could `git init && git pull origin/main` but rsync from the
  # runner's git checkout is faster and matches the source
  # exactly (same SHA as the commit the workflow just built).
  #
  # Runs on a dummy ubuntu runner with the SSH key. The reusable
  # runs after, picks up the updated source, and builds from it.
  sync-source-on-host:
    name: Sync source on host to origin/main
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY || secrets.COOLIFY_SSH_KEY }}
      - name: Push source to host via rsync
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.COOLIFY_HOST }}
          USER: ${{ secrets.VPS_USER || secrets.COOLIFY_USER }}
        run: |
          # Push every file in this repo EXCEPT .git (the host
          # doesn't need git history — it just needs the working
          # tree as the Docker build context), node_modules
          # (Docker builds from package*.json + a `npm ci` step,
          # no need to push 100K+ files of dependencies), and
          # .github/workflows (host doesn't run GH Actions; the
          # reusable handles the deploy). Also skip dist/ (output
          # directory) and .hermes/ (local-only).
          #
          # 3-attempt retry: the Hostinger VPS sshd occasionally
          # hangs on connect (verified pattern, see memory
          # 'Hostinger VPS SSH daemon intermittent failure'). A
          # single transient failure used to skip the sync and
          # fall through to a deploy-with-stale-source, which
          # was the root cause of the 'Olive source is b75adb5
          # not d32663f' bug fixed by this commit. Retrying
          # makes the sync robust to that 1-2x-per-day blip.
          #
          # Failure gate: if all 3 attempts fail, the script
          # exits non-zero. Without this gate, the verify step
          # would print the host's old public/sw.js (which would
          # pass the `head -5` check), and the deploy step
          # would then build from the same stale source. The
          # audit (b75adb5) flagged this as a HIGH severity
          # silent-failure mode.
          SYNC_SUCCEEDED=0
          for i in 1 2 3; do
            if ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new $USER@$HOST "mkdir -p /opt/projects/contraction-tracker/src" 2>/dev/null \
              && rsync -az --delete \
                   --exclude='.git/' \
                   --exclude='node_modules/' \
                   --exclude='dist/' \
                   --exclude='.hermes/' \
                   --exclude='.github/workflows/' \
                   --exclude='*.log' \
                   ./ $USER@$HOST:/opt/projects/contraction-tracker/src/ 2>/dev/null; then
              echo "Sync attempt $i succeeded"
              SYNC_SUCCEEDED=1
              break
            fi
            echo "Sync attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ "$SYNC_SUCCEEDED" != "1" ]; then
            echo "::error::All 3 sync attempts failed; host source may be stale. Refusing to deploy."
            exit 1
          fi
          # Verify the synced CACHE_NAME matches the expected
          # version (currently olive-v9). Without this check, a
          # corrupt partial-sync (where rsync left a truncated
          # file mid-transfer) would silently slip through to
          # the build. The b75adb5 audit flagged this as
          # MEDIUM severity.
          EXPECTED_CACHE="olive-v10"
          ACTUAL_CACHE=$(ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new $USER@$HOST "grep -oE 'CACHE_NAME = .[^;]+' /opt/projects/contraction-tracker/src/public/sw.js | head -1 | sed \"s/.*'\(.*\)'/\1/\"")
          echo "Expected SW CACHE_NAME: $EXPECTED_CACHE"
          echo "Actual SW CACHE_NAME:   $ACTUAL_CACHE"
          if [ "$ACTUAL_CACHE" != "$EXPECTED_CACHE" ]; then
            echo "::error::Host SW CACHE_NAME '$ACTUAL_CACHE' does not match expected '$EXPECTED_CACHE'. Refusing to deploy."
            exit 1
          fi

  deploy:
    name: Deploy contraction-tracker
    # The deploy job MUST run after sync-source-on-host. Without
    # `needs:`, both jobs start in parallel and the deploy could
    # build from a stale src/ if the rsync hasn't completed yet.
    # The b75adb5 audit flagged this as MEDIUM severity.
    needs: [sync-source-on-host, legacy-secret-check]
    uses: camster91/ashbi-deploy/.github/workflows/deploy.yml@v0.1.0
    with:
      project_name: contraction-tracker
      port: "3031"
      public_url: https://contractions.ashbi.ca
      # Base64-encoded docker-compose.yml and .env. Decoded into
      # /opt/projects/contraction-tracker/ on the host. See the
      # README in camster91/ashbi-deploy for why we base64 (YAML/
      # heredoc nesting bug avoidance).
      compose_b64: 
      env_b64: VklURV9SRUxBWV9VUkw9aHR0cHM6Ly9yZWxheS5hc2hiaS5jYQpWSVRFX1BVQkxJQ19VUkw9aHR0cHM6Ly9jb250cmFjdGlvbnMuYXNoYmkuY2EK
      # Paired relay (Express + sql.js SSE backend)
      relay_project_name: contraction-tracker-relay
      relay_port: "3032"
      relay_compose_b64: 
      relay_env_b64: UE9SVD0zMDAwCkRCX1BBVEg9L2FwcC9kYXRhL3JlbGF5LmRiCkFMTE9XRURfT1JJR0lOPWh0dHBzOi8vY29udHJhY3Rpb25zLmFzaGJpLmNhCg==
    secrets:
      vps_ssh_key: ${{ secrets.VPS_SSH_KEY || secrets.COOLIFY_SSH_KEY }}
      vps_host:    ${{ secrets.VPS_HOST    || secrets.COOLIFY_HOST }}
      vps_user:    ${{ secrets.VPS_USER    || secrets.COOLIFY_USER }}

  # Pre-flight: surface legacy COOLIFY_* secret usage as a warning.
  # If a stale COOLIFY_* value is set in this repo, the deploy would
  # silently use it via the || fallback above. The audit (commit
  # a7aead4) flagged this as a LOW-severity issue. We can't read
  # another secret's *value* (secrets are opaque), but we can detect
  # presence via the `actions/secrets/variables` API or, more
  # simply, by checking if the reusable's env landed in the
  # working dir. This step is best-effort: if it can't tell, it
  # says so and moves on. Hard-fail is overkill — the legacy
  # alias is there for backward compat and shouldn't block deploys.
  legacy-secret-check:
    name: Warn if legacy COOLIFY_* secrets are set
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          HAS_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
          HAS_COOLIFY_SSH_KEY: ${{ secrets.COOLIFY_SSH_KEY != '' }}
        run: |
          if [ "$HAS_COOLIFY_SSH_KEY" = "true" ] && [ "$HAS_VPS_SSH_KEY" != "true" ]; then
            echo "::warning::COOLIFY_SSH_KEY is set but VPS_SSH_KEY is not. Deploy will use the legacy alias. Remove the COOLIFY_* secret from this repo's settings to avoid silent fallback."
          elif [ "$HAS_COOLIFY_SSH_KEY" = "true" ]; then
            echo "::notice::COOLIFY_SSH_KEY is set (legacy) — VPS_SSH_KEY takes precedence. Safe to remove the COOLIFY_* alias when convenient."
          fi
