# Olive — Contraction Timer PWA
# Deploy: ssh into VPS → rsync source → write compose + .env at
# /opt/projects/contraction-tracker → docker compose build (no-cache)
# → up -d → smoke test → health-check live URLs.
# Reports status to GitHub Actions summary.
#
# Pattern matches the local deploy-to-vps.sh script. The VPS path is
# /opt/projects/contraction-tracker/ (not the legacy Coolify
# /data/coolify/applications path — Coolify is gone as of 2026-06-12).
#
# Required GitHub secrets (names are legacy from the Coolify era but
# the values are the same — root SSH into 187.77.26.99):
#   COOLIFY_SSH_KEY  — private key, root@187.77.26.99
#   COOLIFY_HOST     — hostname or IP, e.g. "187.77.26.99" or "coolify"
#   COOLIFY_USER     — ssh user, "root"
#
# Required GitHub environment:
#   production — gates the deploy job, gives a manual approval gate if
#                configured under Settings → Environments.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'manual'

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  # Canonical VPS project dirs. Caddy reverse-proxies
  # contractions.ashbi.ca and relay.ashbi.ca to 127.0.0.1:3031 and
  # 127.0.0.1:3032 respectively (configured in /opt/caddy/Caddyfile).
  PROJECT_DIR: /opt/projects/contraction-tracker
  RELAY_PROJECT_DIR: /opt/projects/contraction-tracker-relay
  # App-side ports (inside the container is 3000, the host-side mapping
  # is what Caddy talks to). 3020/3021 are taken by lull-relay on the
  # shared VPS, so contraction-tracker uses 3031/3032.
  TRACKER_PORT: "3031"
  RELAY_PORT: "3032"
  PUBLIC_URL: https://contractions.ashbi.ca
  RELAY_PUBLIC_URL: https://relay.ashbi.ca
  # Compose files + .env are base64-encoded inline (see *_B64 vars below).
  # Encoding avoids YAML/heredoc indentation issues with multi-line
  # strings nested inside ssh heredocs on the runner. Decoded on the
  # host into the right project dir. Earlier draft inlined the .env
  # files via `cat > .env <<ENV_EOF` heredocs — that broke because the
  # outer `<<EOF` heredoc captured the inner heredoc's body as literal
  # text and the tracker .env ended up containing the relay's heredoc
  # lines. base64 sidesteps it.
  TRACKER_COMPOSE_B64: 
  TRACKER_ENV_B64: VklURV9SRUxBWV9VUkw9aHR0cHM6Ly9yZWxheS5hc2hiaS5jYQpWSVRFX1BVQkxJQ19VUkw9aHR0cHM6Ly9jb250cmFjdGlvbnMuYXNoYmkuY2EK
  RELAY_ENV_B64: UE9SVD0zMDAwCkRCX1BBVEg9L2FwcC9kYXRhL3JlbGF5LmRiCkFMTE9XRURfT1JJR0lOPWh0dHBzOi8vY29udHJhY3Rpb25zLmFzaGJpLmNhCg==
  RELAY_COMPOSE_B64: 

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve current version
        id: version
        run: |
          VERSION=$(grep -oP "const APP_VERSION = '\K[^']+" src/App.tsx || echo "unknown")
          CACHE=$(grep -oP "const CACHE_NAME = '\K[^']+" public/sw.js || echo "unknown")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "cache=$CACHE" >> $GITHUB_OUTPUT
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Deploying Olive v$VERSION ($CACHE) @ $SHORT_SHA"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.COOLIFY_SSH_KEY }}

      - name: Add host to known_hosts
        # Pulled from the actual host on 2026-06-12 via `ssh-keyscan -H
        # 187.77.26.99`. Inline because GitHub Actions runners block
        # outbound port 22 by default so ssh-keyscan times out. Lines
        # written via printf so the YAML parser doesn't try to read the
        # long base64 blobs as mapping keys.
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' \
            '187.77.26.99 ssh-rsa ' \
            '187.77.26.99 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBJlCcQfxZM13+CjrEnMZhgwyjVk36K342Yzhv/E3xm7GUNthegor0435SNre1t1W9GGYsHpSyEwQ7ceShAmBgC0=' \
            >> ~/.ssh/known_hosts
          echo "Added $(wc -l < ~/.ssh/known_hosts) known hosts"

      - name: "Pre-deploy: clear fail2ban self-ban"
        # fail2ban on the host sometimes bans the GitHub Actions runner
        # after repeated SSH attempts. Detect + unban before the actual
        # deploy SSH commands run.
        continue-on-error: true
        env:
          HOST: ${{ secrets.COOLIFY_HOST }}
          USER: ${{ secrets.COOLIFY_USER }}
        run: |
          MY_IP=$(curl -sS --max-time 10 https://api.ipify.org || echo "")
          if [ -z "$MY_IP" ]; then
            echo "Could not determine runner IP; skipping fail2ban check"
            exit 0
          fi
          echo "Runner IP: $MY_IP"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new $USER@$HOST "fail2ban-client set sshd unbanip $MY_IP" || echo "fail2ban unban failed (probably not banned), continuing"

      - name: Sync tracker source to host
        # rsync the source from the runner to the VPS. Excludes the
        # same paths the local deploy-to-vps.sh script does
        # (node_modules, dist, .git, native dirs, tests).
        env:
          HOST: ${{ secrets.COOLIFY_HOST }}
          USER: ${{ secrets.COOLIFY_USER }}
        run: |
          rsync -az --delete \
            --exclude='node_modules' --exclude='dist' --exclude='.git' \
            --exclude='.env' --exclude='android' --exclude='ios' \
            --exclude='playwright-report' --exclude='tests' \
            ./ "$USER@$HOST:$PROJECT_DIR/src/"

      - name: Sync relay source to host
        # The relay lives in a separate repo (luna-relay). Pre-cloned on
        # the host at ~/repos/luna-relay. Pull latest + rsync to the
        # project dir.
        env:
          HOST: ${{ secrets.COOLIFY_HOST }}
          USER: ${{ secrets.COOLIFY_USER }}
        run: |
          ssh "$USER@$HOST" 'cd ~/repos/luna-relay && git fetch origin && git reset --hard origin/main' || true
          ssh "$USER@$HOST" "rsync -az --delete \
            --exclude='node_modules' --exclude='.git' --exclude='data' \
            ~/repos/luna-relay/ $RELAY_PROJECT_DIR/src/"

      - name: Write docker-compose + .env on host
        # Compose files + .env are base64-encoded in the workflow env
        # to avoid YAML/heredoc indentation issues. Decoded on the
        # host into the right project dir. See TRACKER_COMPOSE_B64,
        # RELAY_COMPOSE_B64, TRACKER_ENV_B64, RELAY_ENV_B64 in env:.
        env:
          HOST: ${{ secrets.COOLIFY_HOST }}
          USER: ${{ secrets.COOLIFY_USER }}
        run: |
          ssh "$USER@$HOST" <<EOF
            set -e
            mkdir -p $PROJECT_DIR $RELAY_PROJECT_DIR
            echo '$TRACKER_COMPOSE_B64' | base64 -d > $PROJECT_DIR/docker-compose.yml
            echo '$RELAY_COMPOSE_B64'   | base64 -d > $RELAY_PROJECT_DIR/docker-compose.yml
            echo '$TRACKER_ENV_B64'     | base64 -d > $PROJECT_DIR/.env
            echo '$RELAY_ENV_B64'       | base64 -d > $RELAY_PROJECT_DIR/.env
            echo "Wrote compose + .env files:"
            ls -la $PROJECT_DIR/ $RELAY_PROJECT_DIR/
            echo "--- tracker .env ---"
            cat $PROJECT_DIR/.env
            echo "--- relay .env ---"
            cat $RELAY_PROJECT_DIR/.env
          EOF

      - name: Build + restart containers
        env:
          HOST: ${{ secrets.COOLIFY_HOST }}
          USER: ${{ secrets.COOLIFY_USER }}
        run: |
          ssh "$USER@$HOST" <<EOF
            set -e
            # No --pull: the host's Docker build namespace can't resolve
            # registry-1.docker.io (worked around in 2026-06 by building
            # from local context). --no-cache forces a clean build so a
            # bad layer doesn't get pinned across deploys.
            echo "Building tracker..."
            cd $PROJECT_DIR
            docker compose build --no-cache
            echo "Building relay..."
            cd $RELAY_PROJECT_DIR
            docker compose build --no-cache
            echo "Starting tracker..."
            cd $PROJECT_DIR
            docker compose up -d
            echo "Starting relay..."
            cd $RELAY_PROJECT_DIR
            docker compose up -d
            sleep 4
            echo "--- Container status ---"
            docker ps --filter "name=contraction-tracker" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
          EOF

      - name: Smoke test (localhost)
        env:
          HOST: ${{ secrets.COOLIFY_HOST }}
          USER: ${{ secrets.COOLIFY_USER }}
        run: |
          ssh "$USER@$HOST" <<EOF
            echo "Tracker (127.0.0.1:$TRACKER_PORT):"
            curl -sI -o /dev/null -w "  HTTP %{http_code} in %{time_total}s\n" --max-time 10 http://127.0.0.1:$TRACKER_PORT
            echo "Relay (127.0.0.1:$RELAY_PORT):"
            curl -sI -o /dev/null -w "  HTTP %{http_code} in %{time_total}s\n" --max-time 10 http://127.0.0.1:$RELAY_PORT
            echo "Relay health ($RELAY_PUBLIC_URL/api/health):"
            curl -sS --max-time 10 $RELAY_PUBLIC_URL/api/health
            echo
          EOF

      - name: Health check (live public URLs)
        run: |
          sleep 5
          # Tracker — verify it returns 200 and serves the new SW cache
          HTTP=$(curl -s -o /tmp/olive.html -w "%{http_code}" --max-time 30 "$PUBLIC_URL/")
          CACHE_LIVE=$(curl -s --max-time 10 "$PUBLIC_URL/sw.js" | grep -oP "const CACHE_NAME = '\K[^']+" || echo "unknown")
          echo "Tracker live HTTP: $HTTP"
          echo "Tracker live SW cache:  $CACHE_LIVE"
          echo "Expected cache:         ${{ steps.version.outputs.cache }}"
          if [ "$HTTP" != "200" ]; then
            echo "::error::Live tracker returned $HTTP"
            exit 1
          fi
          if [ "$CACHE_LIVE" != "${{ steps.version.outputs.cache }}" ]; then
            echo "::warning::SW cache mismatch. Live=$CACHE_LIVE, expected=${{ steps.version.outputs.cache }}. This usually means the SW hasn't been activated yet."
          fi
          # Relay health
          RELAY_HEALTH=$(curl -s --max-time 15 "$RELAY_PUBLIC_URL/api/health")
          echo "Relay health: $RELAY_HEALTH"
          if ! echo "$RELAY_HEALTH" | grep -q '"ok":true'; then
            echo "::error::Relay health check failed"
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CACHE: ${{ steps.version.outputs.cache }}
          SHA: ${{ steps.version.outputs.sha }}
          TRIGGER: ${{ github.event_name }}
          REASON: ${{ github.event.inputs.reason || '' }}
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Olive deploy"
            echo ""
            echo "- **Version:** $VERSION"
            echo "- **Cache:**  $CACHE"
            echo "- **SHA:**    $SHA"
            echo "- **Tracker:** $PUBLIC_URL/"
            echo "- **Relay:**   $RELAY_PUBLIC_URL/api/health"
            echo "- **Result:** $JOB_STATUS"
            echo ""
            if [ -n "$COMMIT_MSG" ]; then
              echo "Trigger: $TRIGGER — $COMMIT_MSG"
            elif [ -n "$REASON" ]; then
              echo "Trigger: $TRIGGER ($REASON)"
            else
              echo "Trigger: $TRIGGER"
            fi
          } >> $GITHUB_STEP_SUMMARY
