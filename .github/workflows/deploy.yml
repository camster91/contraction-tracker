# contraction-tracker — VPS deploy
#
# Thin caller for camster91/ashbi-deploy's reusable workflow. The
# reusable handles ssh, docker build, up, smoke test, health check.
# This file just provides the project-specific config (compose +
# .env, port, public URL, paired relay).
#
# Image versioning / rollback:
#   This repo deploys via the camster91/ashbi-deploy reusable.
#   The reusable writes docker-compose.yml + .env on the host,
#   then `docker compose build --no-cache` from the host's
#   /opt/projects/contraction-tracker/src/ directory. The reusable
#   does NOT pull source. Pre-flight `sync-source-on-host` job
#   below does that — it git-resets /opt/projects/contraction-tracker/src
#   to origin/main before the deploy job runs. Without that pre-flight,
#   the build context on the host would be whatever was checked out
#   at the time of the FIRST deploy (often a stale chore-champs
#   checkout or similar), and `docker compose build` would happily
#   produce an old image even after a successful workflow run. The
#   pre-flight is what keeps the live container in sync with the
#   current source. To rollback this live app, push a known-good
#   commit and the pre-flight will pull it; or `git checkout <sha>`
#   on the host manually.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Pre-flight: pull latest source on the host so the build context
  # in /opt/projects/contraction-tracker/src/ is up-to-date when the
  # reusable runs `docker compose build --no-cache`. Without this
  # step, the build would use whatever was checked out at the time
  # of the first deploy, and the deploy workflow would silently
  # produce an old image even after a "successful" run.
  #
  # Idempotent: a fast-forward merge when main is ahead, or a
  # no-op when the host's checkout is already at the same SHA.
  # If the local checkout has uncommitted changes (e.g. an
  # operator was debugging on the host), the fetch + reset would
  # discard them — that's the intended "deploy overrides local
  # edits" behavior. The reusable doesn't touch source, so
  # there's no merge conflict possible.
  #
  # Runs on a dummy ubuntu runner with the SSH key, mirrors the
  # reusable's setup. The reusable runs separately, picks up the
  # updated source, and builds from it.
  sync-source-on-host:
    name: Sync source on host to origin/main
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY || secrets.COOLIFY_SSH_KEY }}
      - name: Pull latest on host
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.COOLIFY_HOST }}
          USER: ${{ secrets.VPS_USER || secrets.COOLIFY_USER }}
        run: |
          ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new $USER@$HOST <<'EOF'
            set -e
            cd /opt/projects/contraction-tracker/src
            # Defensive: if the remote is misnamed (a previous
            # deploy set it to chore-champs, or some other app
            # cloned in as a sentinel), point it at the real
            # contraction-tracker repo. Cheap no-op if already
            # correct.
            if ! git remote get-url origin | grep -q contraction-tracker; then
              echo "Origin remote is not contraction-tracker; resetting"
              git remote set-url origin https://github.com/camster91/contraction-tracker.git
            fi
            # Track main if not already on it (the build context
            # needs to be the source the deploy workflow just
            # pushed to, not some side branch).
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "detached")
            if [ "$CURRENT_BRANCH" != "main" ]; then
              echo "Currently on '$CURRENT_BRANCH'; switching to main"
              git checkout main 2>&1 | tail -3 || true
            fi
            # Fetch + hard-reset to origin/main. The build context
            # after this is exactly the source the workflow just
            # pushed. The reusable's `docker compose build --no-cache`
            # will then use this as the build context.
            git fetch origin main 2>&1 | tail -3
            git reset --hard origin/main 2>&1 | tail -3
            echo "Source now at:"
            git log --oneline -1
          EOF

  deploy:
    name: Deploy contraction-tracker
    uses: camster91/ashbi-deploy/.github/workflows/deploy.yml@v0.1.0
    with:
      project_name: contraction-tracker
      port: "3031"
      public_url: https://contractions.ashbi.ca
      # Base64-encoded docker-compose.yml and .env. Decoded into
      # /opt/projects/contraction-tracker/ on the host. See the
      # README in camster91/ashbi-deploy for why we base64 (YAML/
      # heredoc nesting bug avoidance).
      compose_b64: 
      env_b64: VklURV9SRUxBWV9VUkw9aHR0cHM6Ly9yZWxheS5hc2hiaS5jYQpWSVRFX1BVQkxJQ19VUkw9aHR0cHM6Ly9jb250cmFjdGlvbnMuYXNoYmkuY2EK
      # Paired relay (Express + sql.js SSE backend)
      relay_project_name: contraction-tracker-relay
      relay_port: "3032"
      relay_compose_b64: 
      relay_env_b64: UE9SVD0zMDAwCkRCX1BBVEg9L2FwcC9kYXRhL3JlbGF5LmRiCkFMTE9XRURfT1JJR0lOPWh0dHBzOi8vY29udHJhY3Rpb25zLmFzaGJpLmNhCg==
    secrets:
      vps_ssh_key: ${{ secrets.VPS_SSH_KEY || secrets.COOLIFY_SSH_KEY }}
      vps_host:    ${{ secrets.VPS_HOST    || secrets.COOLIFY_HOST }}
      vps_user:    ${{ secrets.VPS_USER    || secrets.COOLIFY_USER }}

  # Pre-flight: surface legacy COOLIFY_* secret usage as a warning.
  # If a stale COOLIFY_* value is set in this repo, the deploy would
  # silently use it via the || fallback above. The audit (commit
  # a7aead4) flagged this as a LOW-severity issue. We can't read
  # another secret's *value* (secrets are opaque), but we can detect
  # presence via the `actions/secrets/variables` API or, more
  # simply, by checking if the reusable's env landed in the
  # working dir. This step is best-effort: if it can't tell, it
  # says so and moves on. Hard-fail is overkill — the legacy
  # alias is there for backward compat and shouldn't block deploys.
  legacy-secret-check:
    name: Warn if legacy COOLIFY_* secrets are set
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          HAS_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
          HAS_COOLIFY_SSH_KEY: ${{ secrets.COOLIFY_SSH_KEY != '' }}
        run: |
          if [ "$HAS_COOLIFY_SSH_KEY" = "true" ] && [ "$HAS_VPS_SSH_KEY" != "true" ]; then
            echo "::warning::COOLIFY_SSH_KEY is set but VPS_SSH_KEY is not. Deploy will use the legacy alias. Remove the COOLIFY_* secret from this repo's settings to avoid silent fallback."
          elif [ "$HAS_COOLIFY_SSH_KEY" = "true" ]; then
            echo "::notice::COOLIFY_SSH_KEY is set (legacy) — VPS_SSH_KEY takes precedence. Safe to remove the COOLIFY_* alias when convenient."
          fi
