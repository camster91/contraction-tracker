name: gauntlet

permissions:
  contents: read

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs of the same workflow when a new commit lands
concurrency:
  group: gauntlet-${{ github.ref }}

jobs:
  e2e:
    name: Playwright Gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Typecheck e2e tests
        run: ./node_modules/.bin/tsc -p tests/tsconfig.json

      - name: Build production bundle
        run: npm run build

      - name: Run gauntlet
        run: npx playwright test --reporter=github,html,line,./scripts/strict-release-reporter.mjs

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
