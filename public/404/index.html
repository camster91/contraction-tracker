<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#120c10" />
<title>Page not found — Olive</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<style>
  :root {
    --plum-950: #120c10;
    --ink-50: #faf6f4;
    --ink-200: #e8d9d1;
    --ink-400: #b89184;
    --rose-300: #e8957a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100dvh;
    background: var(--plum-950);
    color: var(--ink-50);
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap {
    max-width: 480px;
    text-align: center;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 96px;
    line-height: 1;
    margin: 0 0 16px;
    letter-spacing: -0.02em;
    color: var(--rose-300);
  }
  h2 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 24px;
    margin: 0 0 12px;
  }
  p {
    color: var(--ink-200);
    line-height: 1.6;
    margin: 0 0 24px;
  }
  a {
    color: var(--rose-300);
    text-decoration: none;
    border-bottom: 1px solid rgba(232, 149, 122, 0.3);
    font-weight: 500;
  }
  a:hover { border-bottom-color: var(--rose-300); }
  .links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<main class="wrap">
  <h1>404</h1>
  <h2>That page doesn't exist</h2>
  <p>The link you followed may be old, or you may have mistyped the address. If you got here from inside Olive, please let us know — that's a bug.</p>
  <p class="links">
    <a href="/">← back to the timer</a>
    <a href="/privacy">privacy policy</a>
  </p>
</main>
</body>
</html>
