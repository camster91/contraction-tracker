<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="heartGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f3bca9"/>
      <stop offset="50%" stop-color="#e8957a"/>
      <stop offset="100%" stop-color="#c25a3f"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a20"/>
      <stop offset="100%" stop-color="#120c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d97459" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97459" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background squircle -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <!-- Warm glow behind heart -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#glow)"/>
  <!-- Heart: two circles + triangle, mathematically centered -->
  <g transform="translate(256 268)">
    <!-- Lobes -->
    <circle cx="-72" cy="0" r="72" fill="url(#heartGrad)"/>
    <circle cx="72" cy="0" r="72" fill="url(#heartGrad)"/>
    <!-- Triangle pointing down -->
    <polygon points="-140,-8 140,-8 0,160" fill="url(#heartGrad)"/>
  </g>
</svg>
